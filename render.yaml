services:
  - type: web
    name: aasoo-macrame-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm db:migrate && pnpm db:seed && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SMS_SEND
        value: "false"
      - key: DATABASE_PATH
        value: gereh.db
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        value: changeme
      - key: SEED_ADMIN_DISPLAY_NAME
        value: مدیر کارگاه
      - key: ZARINPAL_MERCHANT_ID
        value: 00000000-0000-0000-0000-000000000000
      - key: ZARINPAL_BASE_URL
        value: https://sandbox.zarinpal.com
